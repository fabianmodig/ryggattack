# Serves the Ryggattack WebAssembly bundle. web/Dockerfile installs this as
# /etc/nginx/conf.d/default.conf, replacing the base image's welcome page.
#
# Port 8080 rather than 80, so the container also runs as a non-root user.

server {
    # IPv4 only: a container started without IPv6 cannot bind [::] and nginx
    # would refuse to start. Published ports reach this either way.
    listen 8080;
    server_name _;

    # nginx HTTP error messages append the raw request and Referer, and its
    # error log has no safe custom format. Suppress request-context errors in
    # this server only (including malformed requests handled by the default
    # server). Keep global startup/process diagnostics on stderr and sanitized
    # status/byte access logs on stdout; do not enable request debug logging.
    error_log /dev/null;

    root /usr/share/nginx/html;
    index index.html;

    # The image ships the two large files pre-compressed; the rest is small
    # enough to compress per request. Every release reuses the same file
    # names, so nothing here is cached past its ETag.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # A browser refuses to stream a module that arrives as anything but
    # application/wasm. An empty `types` block drops the inherited map for
    # this location only, which leaves `default_type` to answer.
    location ~ \.mjs$ {
        try_files $uri =404;
        types { }
        default_type text/javascript;
    }
    location ~ \.wasm$ {
        try_files $uri =404;
        types { }
        default_type application/wasm;
    }
}

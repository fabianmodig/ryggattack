---
# Source: ryggattack/templates/networkpolicy.yaml
# Game ports are reachable through Traefik. The management port is not public:
# only same-namespace pods (e.g. an explicitly installed monitor) may query it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ryggattack
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: ryggattack}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8787}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8788}

---
# Source: ryggattack/templates/workloads.yaml
apiVersion: v1
kind: Service
metadata:
  name: ryggattack-web
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: web}
  ports:
    - {name: http, port: 8080, targetPort: http}

---
# Source: ryggattack/templates/workloads.yaml
apiVersion: v1
kind: Service
metadata:
  name: ryggattack-server
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: server}
  ports:
    - {name: websocket, port: 8787, targetPort: websocket}
    - {name: management, port: 8788, targetPort: management}

---
# Source: ryggattack/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryggattack-web
  labels: {app.kubernetes.io/name: ryggattack, app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: web}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ryggattack, app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: web}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{"name":"forgejo-pull-secret"}]
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "git.modig.online/fabianmodig/ryggattack/web:sha-e0d6439"
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {"limits":{"cpu":"1","memory":"128Mi"},"requests":{"cpu":"50m","memory":"32Mi"}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: temp
          emptyDir: {sizeLimit: 16Mi}

---
# Source: ryggattack/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryggattack-server
  labels: {app.kubernetes.io/name: ryggattack, app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: server}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ryggattack, app.kubernetes.io/instance: ryggattack, app.kubernetes.io/component: server}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{"name":"forgejo-pull-secret"}]
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: "git.modig.online/fabianmodig/ryggattack/server:sha-e0d6439"
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {"limits":{"cpu":"2","memory":"2Gi"},"requests":{"cpu":"500m","memory":"512Mi"}}
          args: ["0.0.0.0:8787"]
          env:
            - {name: RYGGATTACK_MODE, value: production}
            - {name: RYGGATTACK_ALLOWED_ORIGINS, value: "https://ryggattack.modig.online"}
            - {name: RYGGATTACK_MANAGEMENT_BIND, value: "0.0.0.0:8788"}
          ports:
            - {name: websocket, containerPort: 8787}
            - {name: management, containerPort: 8788}
          readinessProbe:
            httpGet: {path: /readyz, port: management}
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet: {path: /healthz, port: management}
            periodSeconds: 5
            timeoutSeconds: 1
          startupProbe:
            httpGet: {path: /readyz, port: management}
            failureThreshold: 30
            periodSeconds: 1

---
# Source: ryggattack/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ryggattack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: external
  tls:
    - hosts: [ryggattack.modig.online]
      secretName: ryggattack-tls
  rules:
    - host: ryggattack.modig.online
      http:
        paths:
          - path: /ws
            pathType: Exact
            backend:
              service:
                name: ryggattack-server
                port: {name: websocket}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ryggattack-web
                port: {name: http}

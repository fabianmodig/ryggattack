[package]
name = "ryggattack"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui"] }
# Re-exports `std::time` everywhere except the web, where it reads the clock
# through the browser instead of panicking.
web-time = "1.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Lighter than release: no LTO and parallel codegen, so a wasm build fits in a
# few GB of RAM. Good for iterating on web performance; ship with release.
[profile.web-dev]
inherits = "release"
lto = false
codegen-units = 16
debug = false

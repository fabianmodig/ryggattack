[package]
name = "ryggattack"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui"] }
# Re-exports `std::time` everywhere except the web, where it reads the clock
# through the browser instead of panicking.
web-time = "1.1"

# The browser build keeps video settings in localStorage. Both crates are
# already in the dependency tree through Bevy, so this compiles nothing new.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Lighter than release: no LTO and parallel codegen, so a wasm build fits in a
# few GB of RAM. Good for iterating on web performance; ship with release.
[profile.web-dev]
inherits = "release"
lto = false
codegen-units = 16
debug = false
# opt-level 3 made rustc peak at ~2.6 GB on bevy_pbr and nearly OOM'd the
# 4 GB build host. Level 2 is much lighter and still representative for perf.
opt-level = 2

# bevy_pbr alone still pushed rustc to ~2.7 GB at level 2. It builds at level
# 1 here; release keeps full optimisation.
[profile.web-dev.package.bevy_pbr]
opt-level = 1

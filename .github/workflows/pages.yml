name: Pages migration

# GitHub push mirror publishes only a redirect. The game lives in Kubernetes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    name: Canonical redirect artifact
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/pages-redirect.test.mjs
      - name: Package redirect, not a stale gameplay build
        run: |
          mkdir -p dist/pages
          cp web/pages-redirect.html dist/pages/index.html
          cp web/pages-redirect.html dist/pages/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
  pages:
    name: Deploy GitHub Pages redirect
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

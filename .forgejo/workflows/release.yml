name: Release

# Every push to main is a release: the image is tagged with the commit it was
# built from, and `latest` follows main. Nothing is built from tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      PACKAGE_USER: ${{ secrets.PACKAGE_USER }}
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # Registry paths must be lowercase.
      - name: Resolve the image name and version
        run: |
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=git.modig.online/$repository/web" >> "$GITHUB_ENV"
          echo "VERSION=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # Shared with the web job in ci.yml, so pull requests restore the wasm32
      # cargo cache this job leaves behind on main.
      - uses: ./.github/actions/setup-web-build

      # Only the release path installs this: it trims about a quarter off the
      # module, which matters on a host that serves it uncompressed, but it
      # costs a couple of minutes that the pull request check does not need.
      - name: Install wasm-opt
        env:
          BINARYEN: version_131
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" \
            | tar xz --strip-components=2 -C "$RUNNER_TEMP/bin" "binaryen-$BINARYEN/bin/wasm-opt"
          wasm-opt --version

      - name: Build the web bundle
        run: scripts/build-web.sh

      - name: Install container tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io

      - name: Build the image
        run: |
          docker build \
            --file web/Dockerfile \
            --tag "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            .

      # Find a broken image here rather than after it has been published.
      - name: Smoke-test the image
        run: |
          docker run --detach --name ryggattack-web "$IMAGE:$VERSION"
          container_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ryggattack-web)"

          for _ in $(seq 30); do
            if curl -fsS "http://${container_ip}:8080/" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://${container_ip}:8080/" | grep -q ryggattack-canvas
          type="$(curl -fsS -o /dev/null -w '%{content_type}' \
            "http://${container_ip}:8080/ryggattack_bg.wasm")"
          case "$type" in
            application/wasm*) ;;
            *)
              echo "the module is served as '$type', not application/wasm" >&2
              exit 1
              ;;
          esac

          docker rm -f ryggattack-web

      # Only main publishes; a manual run from another branch stops after the
      # smoke test.
      - name: Log in to Forgejo container registry
        if: github.ref == 'refs/heads/main' && env.PACKAGE_USER != '' && env.PACKAGE_TOKEN != ''
        run: |
          printf '%s' "$PACKAGE_TOKEN" \
            | docker login git.modig.online --username "$PACKAGE_USER" --password-stdin

      - name: Push the image
        if: github.ref == 'refs/heads/main' && env.PACKAGE_USER != '' && env.PACKAGE_TOKEN != ''
        run: |
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"

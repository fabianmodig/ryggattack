name: CI

on:
  # Actions caches are branch-scoped: a pull request can restore what its base
  # branch saved, but not what another pull request saved. Building main keeps
  # a warm cache there for every pull request to start from.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # Two Bevy dependencies resolve system libraries through pkg-config while
      # building: gilrs-core needs libudev and wayland-sys needs wayland-client.
      # X11 and xkbcommon are opened at runtime instead, so the tests need no
      # headers for those.
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libudev-dev libwayland-dev

      # Bevy 0.19 needs rustc 1.95 or newer, so pick up current stable rather
      # than whatever the runner image happens to ship.
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: https://github.com/Swatinem/rust-cache@v2.7.8
        with:
          # Compiling Bevy is nearly all of a cold run, and a failing test does
          # not invalidate it, so keep the dependency build either way.
          cache-on-failure: true
          # A fixed key, so the entry does not change if the job is ever renamed.
          shared-key: test

      - name: Run tests
        run: cargo test --locked

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # No apt step: targeting wasm32 skips the two build scripts that reach
      # for system libraries on Linux.
      - uses: ./.github/actions/setup-web-build

      # Only worth its couple of minutes on the build that gets published;
      # a pull request is being checked, not downloaded by anyone.
      - name: Install wasm-opt
        if: github.ref == 'refs/heads/main'
        env:
          BINARYEN: version_131
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" \
            | tar xz --strip-components=2 -C "$RUNNER_TEMP/bin" "binaryen-$BINARYEN/bin/wasm-opt"
          wasm-opt --version

      # Nothing else compiles this target, so without this job a broken web
      # build would surface only once someone cut a release — and the release
      # would start from a cold cache, since only the default branch can leave
      # one behind for it.
      - name: Build the web bundle
        run: scripts/build-web.sh

      # Pull requests stop at the build. Keep the main-branch bundle as a
      # Forgejo artifact; deployment can be wired to the homelab separately.
      - name: Upload the web bundle
        if: github.ref == 'refs/heads/main'
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: ryggattack-web
          path: dist/web

name: CI

on:
  # Actions caches are branch-scoped: a pull request can restore what its base
  # branch saved, but not what another pull request saved. Building main keeps
  # a warm cache there for every pull request to start from.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Two Bevy dependencies resolve system libraries through pkg-config while
      # building: gilrs-core needs libudev and wayland-sys needs wayland-client.
      # X11 and xkbcommon are opened at runtime instead, so the tests need no
      # headers for those.
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libudev-dev libwayland-dev python3 openssl

      # Bevy 0.19 needs rustc 1.95 or newer, so pick up current stable rather
      # than whatever the runner image happens to ship.
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: https://github.com/Swatinem/rust-cache@v2.7.8
        with:
          # Compiling Bevy is nearly all of a cold run, and a failing test does
          # not invalidate it, so keep the dependency build either way.
          cache-on-failure: true
          # A fixed key, so the entry does not change if the job is ever renamed.
          shared-key: test

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 22

      - name: Test refresh-rate calibration
        run: node --test scripts/refresh-rate.test.mjs

      - name: Test room UI states and validation
        run: |
          node scripts/rooms-ui.test.mjs
          node --test scripts/resilience-harness.test.mjs
          node --test scripts/network-harness.test.mjs
          node --test scripts/prediction-delay.test.mjs
          node --test scripts/client-feedback-helpers.test.mjs
          node --test scripts/solo-bots-helpers.test.mjs
          node --test scripts/online-hud*.test.mjs
          node --test scripts/online-explosion*.test.mjs
          node scripts/pages-redirect.test.mjs
          python3 scripts/update-chart-version.test.py
          python3 scripts/prediction-evidence.py
          python3 scripts/prediction-evidence.test.py

      - name: Run tests
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets

      - name: Production runtime and abuse contract
        run: |
          cargo build --locked --bin ryggattack-server --bin ryggattack-net-probe
          node scripts/native-tls.test.mjs
          node scripts/server-banner.test.mjs
          node scripts/server-policy.test.mjs
          node scripts/production-smoke.mjs
          node scripts/network-sockets.mjs

      - name: Exercise the real headless executable without a display
        run: python3 scripts/headless-smoke.py

  chart:
    name: Helm deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Helm and YAML test dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml curl ca-certificates
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz | tar xz
          install linux-amd64/helm /usr/local/bin/helm
      - run: node --test scripts/container-smoke-network.test.mjs
      - run: node scripts/portable-container-build.test.mjs
      - run: helm lint charts/ryggattack --strict
      - run: python3 scripts/chart-test.py
      - run: python3 scripts/beta-chart.test.py
      - run: python3 scripts/beta-pointer.test.py
      - run: python3 scripts/beta-workflow.test.py

  web:
    name: web build
    runs-on: ubuntu-latest
    # main builds, smoke-tests and publishes the same bundle in release.yml,
    # so this job only checks pull requests and manual runs.
    if: github.event_name != 'push'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # No apt step: targeting wasm32 skips the two build scripts that reach
      # for system libraries on Linux.
      - uses: ./.github/actions/setup-web-build

      # Without this job a broken web build would surface only after the merge,
      # in release.yml.
      - name: Build the web bundle
        run: scripts/build-web.sh
      - name: Bind web artifact to checked-out source
        run: git rev-parse HEAD > dist/web/source-sha.txt
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: beta-web
          path: dist/web
          if-no-files-found: error
          retention-days: 2

  beta:
    name: Publish shared beta desired state
    needs: [test, chart, web]
    # Same-repository contributors can execute workflows and receive secrets;
    # they are trusted publishers. Forks only run the unprivileged checks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "0"
      BETA_PACKAGE_USER: ${{ secrets.BETA_PACKAGE_USER }}
      BETA_PACKAGE_TOKEN: ${{ secrets.BETA_PACKAGE_TOKEN }}
      # Destination-only write credential; source checkout/API use automatic read token.
      BETA_DEPLOY_TOKEN: ${{ secrets.BETA_DEPLOY_TOKEN }}
      PR_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Require publisher credentials
        run: test -n "$BETA_PACKAGE_USER" && test -n "$BETA_PACKAGE_TOKEN" && test -n "$BETA_DEPLOY_TOKEN" && test -n "$PR_READ_TOKEN"
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: beta-web
          path: dist/web
      - name: Verify artifact source and allocate unique beta pair
        run: |
          test "$(cat dist/web/source-sha.txt)" = "$(git rev-parse HEAD)"
          echo "IMAGE=git.modig.online/ryggattack-beta/ryggattack" >> "$GITHUB_ENV"
          # Independent of run-id/attempt semantics: retries of the same SHA
          # get fresh artifact tags, separate from production image repositories.
          python3 -c 'import hashlib,uuid; print("VERSION=sha-" + hashlib.sha256(uuid.uuid4().bytes).hexdigest()[:40])' >> "$GITHUB_ENV"
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 22
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.7.8
        with:
          shared-key: beta-server
      - name: Install portable container and backend tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io libudev-dev libwayland-dev python3-yaml
      - name: Build backend and paired runtime images
        run: |
          cargo build --locked --release --bin ryggattack-server
          mkdir -p dist/server
          cp target/release/ryggattack-server dist/server/
          for component in web server; do
            docker build --file "$component/Dockerfile" --tag "$IMAGE/$component:$VERSION" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --label "org.opencontainers.image.version=$VERSION" .
          done
      - name: Smoke tested web artifact and backend together
        run: CONTAINER_SMOKE_NETWORK_CONTAINER="$HOSTNAME" node scripts/container-smoke.mjs "$IMAGE/web:$VERSION" "$IMAGE/server:$VERSION"
      - name: Publish both beta images then advance desired state
        run: |
          printf '%s' "$BETA_PACKAGE_TOKEN" | docker login git.modig.online --username "$BETA_PACKAGE_USER" --password-stdin
          for component in web server; do
            docker push "$IMAGE/$component:$VERSION"
          done
          python3 scripts/beta-pointer.py --tag "$VERSION"

name: Desktop draft authentication probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only draft asset authorization probe
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://git.modig.online';
          for (const path of [
            '/api/v1/repos/fabianmodig/ryggattack/releases/51',
            '/api/v1/repos/fabianmodig/ryggattack/releases/51/assets/4',
            '/fabianmodig/ryggattack/releases/download/v0.2.0/SHA256SUMS',
            '/attachments/0145a0f5-2dc9-4ff3-9620-a12c2581303e',
            '/fabianmodig/ryggattack/releases/attachments/0145a0f5-2dc9-4ff3-9620-a12c2581303e',
          ]) {
            const response = await fetch(origin + path, {headers: {Authorization: 'token ' + process.env.PROBE_TOKEN}, redirect: 'manual'});
            const data = await response.arrayBuffer();
            console.log(JSON.stringify({path, status: response.status, type: response.headers.get('content-type'), bytes: data.byteLength}));
          }
          JS
